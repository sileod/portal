name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go mod download
          go build -trimpath -ldflags='-s -w' -o portal ./cmd/portal
          tar -czf portal_${GOOS}_${GOARCH}.tar.gz portal
      - uses: actions/upload-artifact@v4
        with:
          name: portal_${{ matrix.os }}_${{ matrix.arch }}
          path: portal_${{ matrix.os }}_${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: portal_*
          merge-multiple: true
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: portal_*.tar.gz
          generate_release_notes: true
      - name: Publish rolling edge release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          name: Portal edge
          prerelease: true
          make_latest: false
          files: portal_*.tar.gz
